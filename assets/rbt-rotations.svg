<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="auto" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="rotCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="subtreeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="940" height="360" rx="16" fill="url(#rotCardBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Divider -->
  <line x1="480" y1="25" x2="480" y2="355" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ==================== LEFT ROTATION PANEL (LEFT HALF) ==================== -->
  <g transform="translate(30, 30)">
    <!-- Title -->
    <text x="0" y="15" fill="#f8fafc" font-size="14" font-weight="700">LEFT-ROTATE(x)</text>
    <text x="140" y="15" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">| O(1) Local Pointer Swaps</text>

    <!-- BEFORE STATE -->
    <g transform="translate(70, 70)">
      <text x="50" y="0" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">BEFORE</text>
      <!-- Edges -->
      <line x1="50" y1="25" x2="20" y2="70" stroke="#475569" stroke-width="2"/>
      <line x1="50" y1="25" x2="80" y2="70" stroke="#3b82f6" stroke-width="2"/>
      <line x1="80" y1="70" x2="60" y2="120" stroke="#475569" stroke-width="2"/>
      <line x1="80" y1="70" x2="100" y2="120" stroke="#475569" stroke-width="2"/>

      <!-- Node x -->
      <circle cx="50" cy="25" r="16" fill="url(#nodeBlue)" filter="url(#shadow)"/>
      <text x="50" y="30" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">x</text>

      <!-- Subtree alpha -->
      <polygon points="20,70 5,100 35,100" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="20" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">α</text>

      <!-- Node y -->
      <circle cx="80" cy="70" r="16" fill="url(#nodePurple)" filter="url(#shadow)"/>
      <text x="80" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">y</text>

      <!-- Subtree beta -->
      <polygon points="60,120 45,150 75,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="60" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">β</text>

      <!-- Subtree gamma -->
      <polygon points="100,120 85,150 115,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="100" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">γ</text>
    </g>

    <!-- Transformation Arrow -->
    <g transform="translate(205, 150)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
      <polygon points="30,-5 40,0 30,5" fill="#38bdf8"/>
    </g>

    <!-- AFTER STATE -->
    <g transform="translate(270, 70)">
      <text x="50" y="0" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">AFTER</text>
      <!-- Edges -->
      <line x1="50" y1="25" x2="20" y2="70" stroke="#3b82f6" stroke-width="2"/>
      <line x1="50" y1="25" x2="80" y2="70" stroke="#475569" stroke-width="2"/>
      <line x1="20" y1="70" x2="0" y2="120" stroke="#475569" stroke-width="2"/>
      <line x1="20" y1="70" x2="40" y2="120" stroke="#475569" stroke-width="2"/>

      <!-- Node y -->
      <circle cx="50" cy="25" r="16" fill="url(#nodePurple)" filter="url(#shadow)"/>
      <text x="50" y="30" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">y</text>

      <!-- Node x -->
      <circle cx="20" cy="70" r="16" fill="url(#nodeBlue)" filter="url(#shadow)"/>
      <text x="20" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">x</text>

      <!-- Subtree alpha -->
      <polygon points="0,120 -15,150 15,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">α</text>

      <!-- Subtree beta -->
      <polygon points="40,120 25,150 55,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="40" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">β</text>

      <!-- Subtree gamma -->
      <polygon points="80,70 65,100 95,100" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="80" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">γ</text>
    </g>

    <!-- BST Order Proof Footer -->
    <g transform="translate(40, 260)">
      <rect x="0" y="0" width="340" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="170" y="17" fill="#38bdf8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">BST Invariant Preserved: α &lt; x &lt; β &lt; y &lt; γ</text>
    </g>
  </g>

  <!-- ==================== RIGHT ROTATION PANEL (RIGHT HALF) ==================== -->
  <g transform="translate(510, 30)">
    <!-- Title -->
    <text x="0" y="15" fill="#f8fafc" font-size="14" font-weight="700">RIGHT-ROTATE(y)</text>
    <text x="150" y="15" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">| O(1) Inverse Transformation</text>

    <!-- BEFORE STATE -->
    <g transform="translate(70, 70)">
      <text x="50" y="0" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">BEFORE</text>
      <!-- Edges -->
      <line x1="50" y1="25" x2="20" y2="70" stroke="#a855f7" stroke-width="2"/>
      <line x1="50" y1="25" x2="80" y2="70" stroke="#475569" stroke-width="2"/>
      <line x1="20" y1="70" x2="0" y2="120" stroke="#475569" stroke-width="2"/>
      <line x1="20" y1="70" x2="40" y2="120" stroke="#475569" stroke-width="2"/>

      <!-- Node y -->
      <circle cx="50" cy="25" r="16" fill="url(#nodePurple)" filter="url(#shadow)"/>
      <text x="50" y="30" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">y</text>

      <!-- Node x -->
      <circle cx="20" cy="70" r="16" fill="url(#nodeBlue)" filter="url(#shadow)"/>
      <text x="20" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">x</text>

      <!-- Subtree alpha -->
      <polygon points="0,120 -15,150 15,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">α</text>

      <!-- Subtree beta -->
      <polygon points="40,120 25,150 55,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="40" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">β</text>

      <!-- Subtree gamma -->
      <polygon points="80,70 65,100 95,100" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="80" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">γ</text>
    </g>

    <!-- Transformation Arrow -->
    <g transform="translate(205, 150)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#a855f7" stroke-width="2.5"/>
      <polygon points="30,-5 40,0 30,5" fill="#a855f7"/>
    </g>

    <!-- AFTER STATE -->
    <g transform="translate(270, 70)">
      <text x="50" y="0" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">AFTER</text>
      <!-- Edges -->
      <line x1="50" y1="25" x2="20" y2="70" stroke="#475569" stroke-width="2"/>
      <line x1="50" y1="25" x2="80" y2="70" stroke="#a855f7" stroke-width="2"/>
      <line x1="80" y1="70" x2="60" y2="120" stroke="#475569" stroke-width="2"/>
      <line x1="80" y1="70" x2="100" y2="120" stroke="#475569" stroke-width="2"/>

      <!-- Node x -->
      <circle cx="50" cy="25" r="16" fill="url(#nodeBlue)" filter="url(#shadow)"/>
      <text x="50" y="30" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">x</text>

      <!-- Subtree alpha -->
      <polygon points="20,70 5,100 35,100" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="20" y="92" fill="#94a3b8" font-size="10" text-anchor="middle">α</text>

      <!-- Node y -->
      <circle cx="80" cy="70" r="16" fill="url(#nodePurple)" filter="url(#shadow)"/>
      <text x="80" y="75" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', monospace">y</text>

      <!-- Subtree beta -->
      <polygon points="60,120 45,150 75,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="60" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">β</text>

      <!-- Subtree gamma -->
      <polygon points="100,120 85,150 115,150" fill="url(#subtreeGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="100" y="142" fill="#94a3b8" font-size="10" text-anchor="middle">γ</text>
    </g>

    <!-- BST Order Proof Footer -->
    <g transform="translate(40, 260)">
      <rect x="0" y="0" width="340" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="170" y="17" fill="#c084fc" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">BST Invariant Preserved: α &lt; x &lt; β &lt; y &lt; γ</text>
    </g>
  </g>
</svg>
